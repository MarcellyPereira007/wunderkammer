<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <!--Javascript das janelas-->

    <script src="./js/posts/blueprince.js"></script>

    <link rel="stylesheet" href="./css/home.css" /> <!--CSS da página-->

<body onload="validarSessao()">

    <!-- Para limitar e não deixar subir ou descer o conteúdo da página -->
    <div id="container">

        <!-- Toda parte da tela, excluindo a barra de tarefas -->

            <!-- Div para a área de atalhos, são 5 linhas e cada linha com 5 colunas-->
            <div class="atalhos">

                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"
                        onclick="abrirApp('./janelas/creditos', 'creditos.avi', 'assets/img/home/appIcons/creditos.png')">
                        <img src="assets/img/home/appIcons/creditos.png">
                        <p>creditos.avi</p>
                    </div>
                    <div class="coluna"></div>
                </div>
                <div class="linha" id="linha2">
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"
                        onclick="abrirApp('./janelas/sobre', 'sobre.sys', 'assets/img/home/appIcons/sobre.png')">
                        <img src="assets/img/home/appIcons/sobre.png">
                        <p>sobre.sys</p>
                    </div>
                    <div class="coluna"></div>
                    <div class="coluna"
                        onclick="abrirApp('./janelas/biblioteca', 'biblioteca.exe', 'assets/img/home/appIcons/biblioteca.png')">

                </div>

                    <div class="coluna"
                        onclick="abrirApp('./janelas/wunderkammer', 'wunderkammer.exe', 'assets/img/home/appIcons/wunderkammer.png')">
                        <img src="assets/img/home/appIcons/wunderkammer.png">
                        <p>wunderkammer.exe</p>
                    </div>
                    <div class="coluna"></div>
                    <div class="coluna"
                        onclick="abrirApp('./janelas/dashboard', 'dashboard.html', 'assets/img/home/appIcons/dashboard.png')">

                    </div>

                </div>
                <div class="linha" id="linha4">
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna" onclick="abrirApp('./janelas/quiz', 'quiz.html', 'assets/img/home/appIcons/quiz.png')">
                        <img src="assets/img/home/appIcons/quiz.png">

                    </div>
                    <div class="coluna"></div>

                </div>
                <div class="linha" id="linha5">
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                </div>
            </div>

            <!-- Div da tela que se torna visível quando abro um atalho-->
            <div class="janela" id="modal">
                
                <!--Janela do wunderkammer-->
                <div class="wunderkammer" id="janela-wunderkammer">

                    <div class="topo">
                        <div class="iconeApp">
                            <img id="janela-icone" src="">

                    <!-- Onde o conteúdo vai ser inserido quando abrir janela -->

        </div>

        <div class="barra-tarefas">

            <!-- Menu iniciar para sair que fica escondido acima do icone de start -->
            <div id="menu-iniciar" class="menu-iniciar">
                <div class="menu-item" onclick="fazerLogout()">
                    <span>Sair</span>
                </div>
                <div class="menu-item" onclick="desligarSistema()">
                    <span>Desligar</span>
                </div>
            </div>

            <div class="start">
                <img id="iconstart" src="assets/img/home/start.png">
            </div>


            <div class="infos">
                <div class="sound">
                    <button id="btn_sound">
                        <img src="assets/img/home/soundcom.png">
                    </button>
                </div>
                <div class="info">
                    <p id="hora_atual">Atualizando hora...</p>

        </div>
    </div>

    <audio id="desktop-song" src="assets/audio/asokah - I always smile, but my eyes are sad.mp3" loop autoplay></audio>
</body>

<script>

    // Função pra abrir janela de acordo com a coluna de atalho que eu cliquei
    function abrirApp(nomeArquivo, tituloApp, caminhoIcone) {

        // Atualiza o topo com o nome do "aplicativo" aberto e puxa o caminho do ícone
        document.getElementById('janela-titulo').innerHTML = tituloApp;
        document.getElementById('janela-icone').src = caminhoIcone;

        // Usa o fetch pra jogar o arquivo dentro
        fetch(nomeArquivo + '.html') // Busca o arquivo
            .then(resposta => resposta.text()) // Pega o resultado dessa busca e transforma em texto
            .then(html => { // Usa o html que já esta formatado dentro dessa função
                document.getElementById('janela-conteudo').innerHTML = html;
                let janela = document.getElementById('modal'); // Pega o modal da janela pelo id
                janela.classList.add('aberta'); // Coloca a classe que deixa ela visível e devolve cliques

                // Quando abrir, precisa validar e chamar as funções determinada de cada tela
                if (nomeArquivo.includes('dashboard')) {
                    setTimeout(() => {
                        iniciarPainelDashboard();
                    }, 100);
                }

                if (nomeArquivo.includes('quiz')) {
                    buscarCategoriasQuiz();
                }

                // if (nomeArquivo.includes('creditos')) {
                //     let video = document.getElementById('video-creditos');
                //     if (video) {
                //         if (tocando) {
                //             musica.pause();
                //         }
                //     }
                // }

                // Pega na tela a tag video
                let video = document.querySelector('video');

                // Se ele puxar algum elemento de vídeo
                if (video) {
                    if (tocando) { // Verifica se a música estava no estado tocando, se tiver, para ela
                        musica.pause();
                    }
                }
            });
    }

    // Função pra fechar janela que foi aberta
    function fecharJanela() {
        let janela = document.getElementById('modal');
        janela.classList.remove('aberta');

        let video = janela.querySelector('video');
        // Se ele pegar algum video
        if (video) {
            video.pause();
        }
        // Volta tocar msc da home
        if (tocando) {
            musica.play();
        }

        setTimeout(() => {
            document.getElementById('janela-conteudo').innerHTML = '';
        }, 300);
    }

    function buscarKpisDashboard() {
    fetch('/dashboard/kpis')
        .then(function(resposta) {
            return resposta.json();
        })
        .then(function(dados) {
            document.getElementById('kpi-usuarios').innerText = dados.totalUsuarios;
            document.getElementById('kpi-posts').innerText = dados.totalPosts;

            let corpoTabela = document.getElementById('corpo-tabela-usuarios');
            corpoTabela.innerHTML = ''; // limpar tabela 

            for (let i = 0; i < dados.ultimosCadastros.length; i++) {
                let usuario = dados.ultimosCadastros[i];
                
                corpoTabela.innerHTML += `
                    <tr>
                        <td>#${usuario.id}</td>
                        <td>${usuario.nome}</td>
                        <td>${usuario.data_cadastro}</td>
                    </tr>
                `;
            }
        })
        .catch(function(erro) {
            console.error('Erro ao buscar dados do dashboard:', erro);
            document.getElementById('status-conexao').innerText = '[ ERRO DE CONEXÃO ]';
        });
}

    function abrirCategoria(nomeDaCategoria) {

        indiceCategoriaAtual = listaCategorias.indexOf(nomeDaCategoria);

        fetch('./janelas/app-lista.html')
            .then(resposta => resposta.text())
            .then(html => {
                document.getElementById('janela-conteudo').innerHTML = html;
                document.getElementById('nome-categoria-atual').innerText = nomeDaCategoria;

                fetch(`/categorias/buscar/${nomeDaCategoria}`)
                    .then(resposta => {
                        if (resposta.status == 404) {
                            return [];
                        }
                        return resposta.json();
                    })
                    .then(listaMaravilhas => {

                        console.log("Lista das maravilhas da categoria:", listaMaravilhas);

                        // Pegar o container onde os cards vão ficar
                        let containerCards = document.querySelector('.container-cards');

                        // Tirar o conteúdo mocado dos 3 cards do Blue Prince).
                        containerCards.innerHTML = '';

                        // Criar um card pra cada maravilha.
                        for (let i = 0; i < listaMaravilhas.length; i++) {

                            let maravilha = listaMaravilhas[i];

                            let card = `<div class="card-post" onclick="abrirPost('${maravilha.caminho_arquivo}')">
                                <div class="card-imagem">
                                <img src="${maravilha.caminho_capa}" alt="${maravilha.titulo}">
                                </div>
                                <div class="card-texto">
                                <h3>${maravilha.titulo}</h3>
                                <p>${maravilha.descricao}</p>
                                </div>
                                </div>`;

                            containerCards.innerHTML += card;
                        }
                    })
                    .catch(erro => console.error('Erro na API buscando as maravilhas:', erro));
            })
            .catch(erro => console.error('Erro ao carregar a lista:', erro));
    }

    function abrirPost(caminho_arquivo) {
        fetch(`${caminho_arquivo}`)
            .then(resposta => resposta.text())
            .then(conteudoPost => {
                document.getElementById('janela-conteudo').innerHTML = conteudoPost;

                if (caminho_arquivo.includes('blueprince')) {
                    montarCarrosselInfinito();
                    iniciarMinijogoParlor();
                }
            })
            .catch(erro => console.error('Erro ao carregar o post:', erro));
    }

    function voltarArmario() {

        fetch('./janelas/wunderkammer.html')
            .then(resposta => resposta.text())
            .then(html => {
                document.getElementById('janela-conteudo').innerHTML = html;
            })
            .catch(erro => console.error('Erro ao voltar para o armário:', erro));
    }

    // navegar nas categorias com as setas
    const listaCategorias = [
        'Tecnologia', 'Linguística', 'Filosofia', 'Quadrinhos',
        'Cultura da internet', 'Cinema & TV', 'Animes', 'Literatura',
        'Saúde mental', 'Jogos', 'Variedades', 'Listas', 'Marcelly', 'Ensaios'
    ];

    let indiceCategoriaAtual = 0;

    function mudarCategoria(direcao) {
        indiceCategoriaAtual += direcao;

        if (indiceCategoriaAtual >= listaCategorias.length) {
            indiceCategoriaAtual = 0;
        } else if (indiceCategoriaAtual < 0) {
            indiceCategoriaAtual = listaCategorias.length - 1;
        }

        let novaCategoria = listaCategorias[indiceCategoriaAtual];
        abrirCategoria(novaCategoria);
    }


    // variaveis pra musica
    let sound = document.getElementById('btn_sound');
    let musica = document.getElementById('desktop-song');

    //booleano pra controlar oq fazer quando clicar
    let tocando = true;

    sound.onclick = mutarDesmutar;

    function mutarDesmutar() {
        //Se não tiver tocando
        if (!tocando) {
            musica.play();
            tocando = true;
            sound.innerHTML = '<img src="assets/img/home/soundcom.png">'
        } else {
            musica.pause();
            tocando = false;
            sound.innerHTML = '<img src="assets/img/home/soundsem.png">'
        }
    }

    //Lógica da data e hora
    // pegar onde elas vao ser mostradas
    let data = document.getElementById('data_atual');
    let hora = document.getElementById('hora_atual');

    //Criar uma função pra atualizar as infos
    function mudarDataHora() {
        //Pegar a data e hora de agora
        let dataHoranovo = new Date(); // VALIDAR
        let dataHora = dataHoranovo.toString();

        //Extrair as partes da sainda com substring pq ta no meu nivel iniciante
        //Modelo da saída padrão
        //Mon Apr 20 2026 15:48:08 GMT-0300 (Horário Padrão de Brasília)

        //let horas = dataHora.getHours(); VALIDAR
        let horas = dataHora.substring(16, 18);
        //let minutos = dataHora.getMinutes();
        let minutos = dataHora.substring(19, 21);
        //let dia = dataHora.getDay();
        let dia = dataHora.substring(8, 10);
        //let mes = dataHora.getMonth();
        let mes = dataHora.substring(4, 7);
        //let ano = dataHora.getFullYear
        let ano = dataHora.substring(11, 15);

        switch (mes) { // VALIDAR
            case 'Jan':
                mes = '01';
                break;
            case 'Feb':
                mes = '02';
                break;
            case 'Mar':
                mes = '03';
                break;
            case 'Apr':
                mes = '04';
                break;
            case 'May':
                mes = '05';
                break;
            case 'Jun':
                mes = '06';
                break;
            case 'Jul':
                mes = '07';
                break;
            case 'Aug':
                mes = '08';
                break;
            case 'Sep':
                mes = '09';
                break;
            case 'Oct':
                mes = '10';
                break;
            case 'Nov':
                mes = '11';
                break;
            case 'Dec':
                mes = '12';
                break;
            default:
                mes = 'XX';
        }
        //Lelet formatado com innerhTML
        hora.innerHTML = `${horas}:${minutos}`;
        data.innerHTML = `${dia}/${mes}/${ano}`;
    }
    //Rodar a função de 1 em 1 segundo
    setInterval(mudarDataHora, 1000);

    // Menu iniciar
    let btnStart = document.getElementById('iconstart');
    let menuIniciar = document.getElementById('menu-iniciar');

    let menuEstaAberto = false;

    // Abrir efechar o menu
    btnStart.onclick = function (evento) {
        if (menuEstaAberto == false) {
            menuIniciar.style.display = 'block'; // Mostra
            menuEstaAberto = true;
        } else {
            menuIniciar.style.display = 'none'; // Esconde
            menuEstaAberto = false;
        }
    };

    // fecha o menu se clicar em outro lugar da tela
    window.onclick = function (evento) {
        // Se o menu tá aberto E o clique NÃO foi na vaquinha, fecha
        if (menuEstaAberto == true && evento.target.id != 'iconstart') {
            menuIniciar.style.display = 'none';
            menuEstaAberto = false;
        }
    };

    // vai pro terminal
    function fazerLogout() {
        sessionStorage.clear();
        window.location.href = 'index.html#terminal';
    }

    // vai pra tela de ligar pc
    function desligarSistema() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>

</html>
