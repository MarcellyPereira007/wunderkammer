<style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap');

    #janela-conteudo {
        background-color: black !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        display: flex;
        flex-direction: column;
    }

    #janela-conteudo::-webkit-scrollbar {
        width: 10px;
    }

    #janela-conteudo::-webkit-scrollbar-track {
        background: #e0d6bd42;
        border-radius: 0px;
    }

    #janela-conteudo::-webkit-scrollbar-thumb {
        background-color: #0c4831;
        border-radius: 10px;
        border: 2px solid #0c4831;
    }

    .post-conteudo {
        background-color: black !important;
        cursor: url("../../assets/img/posts/pesca/pescaCursor.png"), auto !important;
        position: relative;
        font-family: "Comic Relief", system-ui;
        background-image: url('../../assets/img/posts/pesca/pescaprototipo.svg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        aspect-ratio: 1920 / 3049;
        width: 100%;
        margin: 0 auto;
    }

    .btn-voltar-pesca {
        position: absolute;
        font-family: "Comic Relief", system-ui;
        top: 15px;
        left: 15px;
        width: 15%;
        z-index: 2;
        border: 10px solid transparent;
        border-image-source: url('../../assets/img/posts/pesca/pescabotao.png');
        border-image-slice: 20 fill;
        border-image-repeat: stretch;
        padding: 30px 20px 30px;
        color: white;
        font-weight: bolder;
        -webkit-text-stroke: 1px blue;
        background: transparent;
        text-align: center;
        font-size: 30px;
        margin: 20px;
        transition: tranform 0.2s ease, filter 0.1s ease;
        cursor: url("../../assets/img/posts/pesca/pescaPointer.png"), pointer !important;
    }

    .btn-voltar-pesca:hover {
        transform: scale(1.1);
        filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.5));
    }
</style>

<body>
    <div class="post-conteudo">
        <button onclick="abrirCategoria('Variedades')" class="btn-voltar-pesca">Voltar</button>
    </div>
</body>
