<style>

    body {
        margin: 0;
        padding: 0;
        background-color: black;
        width: 100vw;
        height: 100vh;
    }

    #janela-dashboard {
        font-family: 'Courier New', Consolas, monospace;
        background-color: black;
        color: white;
        width: 100%;
        height: 100%;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .dash-header {
        border-bottom: 2px solid white;
        padding-bottom: 10px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .kpi-container {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
    }

    .kpi-card {
        flex: 1;
        border: 1px solid white;
        background-color: rgba(0, 255, 204, 0.05);
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
    }

    .kpi-card h3 {
        font-size: 14px;
        color: #888;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .kpi-valor {
        font-size: 48px;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(177, 191, 188, 0.5);
    }

    .lista-usuarios-container {
        border: 1px solid white;
        padding: 20px;
        background-color: rgba(0, 255, 204, 0.05);
    }

    .lista-usuarios-container h3 {
        margin-bottom: 15px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #tabela-usuarios {
        width: 100%;
        border-collapse: collapse;
    }

    #tabela-usuarios th, #tabela-usuarios td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px dashed white;
    }

    #tabela-usuarios th {
        color: white;
    }
</style>

<body>


<div id="janela-dashboard">
    <div class="dash-header">
        <h2>SYS_MONITOR // mimiomia_OS</h2>
        <span id="status-conexao" style="color: white;">[ ONLINE ]</span>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Total de </h3>
            <div class="kpi-valor" id="kpi-usuarios">--</div>
        </div>
        <div class="kpi-card">
            <h3>Maravilhas</h3>
            <div class="kpi-valor" id="kpi-posts">--</div>
        </div>
    </div>

    <div class="lista-usuarios-container">
        <h3>>> Últimos users</h3>
        <table id="tabela-usuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NOME</th>
                    <th>DATA DE CADASTRO</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-usuarios">
            </tbody>
        </table>
    </div>
</div>

</body>
